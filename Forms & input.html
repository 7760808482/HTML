<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forms and Input</title>
</head>
<body>
    <!--Forms And Input-->
    <form>
        <!-- Name Field -->
        <label for="name">Name:</label><br>
        <input type="text" id="name" placeholder="Enter the Name"><br>
        <br>
        <!-- Email Field -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter Email address"><br>
        <br>
        <!--Password Field-->
        <label form="password">Password:</label><br>
        <input type="password" id="password" placeholder="Enter email password">
        <br>
        <br>
        <!--Number Field-->
        <label for="age">Age:</label><br>
        <input type="number" id="age" placeholder="Enter your age">
        <br>
        <br>
        <!--birth date Field-->
        <label for="birthdate">Date of Birth:</label><br>
        <input type="date" id="birthdate">
        <br>
        <!--Submit Button-->
        <input type="submit" value="Submit">
    </form>
</body>
</html>
