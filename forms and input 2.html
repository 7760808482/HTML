<!DOCTYPE html>
<html>
    <head>
        <title>Forms And Input Part 2</title>
    </head>
    <body>
        <!--Text Area-->
        <label for="message">Message</label><br>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="Enter your message here" cols="20" rows="5"></textarea>
        <br>
         <!--select -->
         <br>
         <label for="gender">Gender</label>
         <select name="gender" id="gender">
            <option value="male" selected>Male</option>       <!--'selected' attribute is used to set the default selected option-->   
            <option value="female">Female</option>
            <option value="other">Other</option>
            <br>
        </select>
            <!--Radio Buttons-->
            <br><br>
            <label for="hobbies">Hobbies:</label><br>
            <input type='radio' id="radio" name="radio" checked>Reading<br>     <!--'checked' attribute is used to set the default selected radio button-->
            
            <input type='radio' id="radio" name="radio">Singing<br>
            <input type='radio' id="radio" name="radio">Dancing<br>
        
        <!--checkbox-->
        <br>
        <label for="hobbies">Hobbies:</label><br>
        <input type="checkbox" id="hobbies" name="hobbies">Drawing<br>
        <input type="checkbox" id="hobbies" name="hobbies">Singing<br>
        <input type="checkbox" id="hobbies" name="hobbies">Dancing<br>
         
        <!--Submit Button-->
        <input type="submit" value="Submit">
    </body>
</html>
